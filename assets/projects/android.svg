<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7c3aed" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="640" cy="400" r="330" fill="#fff" opacity=".45"/>

  <!-- phone 1: calculator -->
  <g transform="translate(250 110) rotate(-8 140 290)" filter="url(#sh)">
    <rect width="280" height="580" rx="42" fill="#2e1065"/>
    <rect x="14" y="14" width="252" height="552" rx="32" fill="#faf5ff"/>
    <rect x="110" y="26" width="60" height="10" rx="5" fill="#2e1065"/>
    <text x="240" y="150" text-anchor="end" font-size="56" font-weight="700" fill="#4c1d95">128</text>
    <text x="240" y="100" text-anchor="end" font-size="22" fill="#a78bfa">64 × 2</text>
    <g font-size="26" font-weight="700" text-anchor="middle">
      <rect x="34" y="200" width="56" height="56" rx="18" fill="#ede9fe"/><text x="62" y="237" fill="#6d28d9">7</text>
      <rect x="112" y="200" width="56" height="56" rx="18" fill="#ede9fe"/><text x="140" y="237" fill="#6d28d9">8</text>
      <rect x="190" y="200" width="56" height="56" rx="18" fill="url(#g2)"/><text x="218" y="237" fill="#fff">÷</text>
      <rect x="34" y="276" width="56" height="56" rx="18" fill="#ede9fe"/><text x="62" y="313" fill="#6d28d9">4</text>
      <rect x="112" y="276" width="56" height="56" rx="18" fill="#ede9fe"/><text x="140" y="313" fill="#6d28d9">5</text>
      <rect x="190" y="276" width="56" height="56" rx="18" fill="url(#g2)"/><text x="218" y="313" fill="#fff">×</text>
      <rect x="34" y="352" width="56" height="56" rx="18" fill="#ede9fe"/><text x="62" y="389" fill="#6d28d9">1</text>
      <rect x="112" y="352" width="56" height="56" rx="18" fill="#ede9fe"/><text x="140" y="389" fill="#6d28d9">2</text>
      <rect x="190" y="352" width="56" height="56" rx="18" fill="url(#g2)"/><text x="218" y="389" fill="#fff">−</text>
      <rect x="34" y="428" width="134" height="56" rx="18" fill="#ede9fe"/><text x="101" y="465" fill="#6d28d9">0</text>
      <rect x="190" y="428" width="56" height="56" rx="18" fill="url(#g1)"/><text x="218" y="465" fill="#fff">=</text>
    </g>
  </g>

  <!-- phone 2: to-do -->
  <g transform="translate(750 90) rotate(7 140 290)" filter="url(#sh)">
    <rect width="280" height="580" rx="42" fill="#2e1065"/>
    <rect x="14" y="14" width="252" height="552" rx="32" fill="#fff"/>
    <rect x="110" y="26" width="60" height="10" rx="5" fill="#2e1065"/>
    <rect x="14" y="50" width="252" height="110" fill="url(#g1)"/>
    <text x="40" y="105" font-size="28" font-weight="800" fill="#fff">My Tasks ✨</text>
    <text x="40" y="135" font-size="16" fill="#f5f3ff">3 of 5 done</text>
    <g font-size="17" fill="#4c1d95">
      <rect x="32" y="185" width="216" height="58" rx="16" fill="#faf5ff"/><circle cx="60" cy="214" r="12" fill="#a78bfa"/><path d="M54 214 l5 5 9-10" stroke="#fff" stroke-width="3" fill="none"/><text x="84" y="220" text-decoration="line-through" fill="#a78bfa">Design UI</text>
      <rect x="32" y="255" width="216" height="58" rx="16" fill="#faf5ff"/><circle cx="60" cy="284" r="12" fill="#a78bfa"/><path d="M54 284 l5 5 9-10" stroke="#fff" stroke-width="3" fill="none"/><text x="84" y="290" text-decoration="line-through" fill="#a78bfa">Write logic</text>
      <rect x="32" y="325" width="216" height="58" rx="16" fill="#faf5ff"/><circle cx="60" cy="354" r="12" fill="#a78bfa"/><path d="M54 354 l5 5 9-10" stroke="#fff" stroke-width="3" fill="none"/><text x="84" y="360" text-decoration="line-through" fill="#a78bfa">Debug</text>
      <rect x="32" y="395" width="216" height="58" rx="16" fill="#fdf2f8"/><circle cx="60" cy="424" r="12" fill="none" stroke="#f472b6" stroke-width="3"/><text x="84" y="430">Test on device</text>
      <rect x="32" y="465" width="216" height="58" rx="16" fill="#fdf2f8"/><circle cx="60" cy="494" r="12" fill="none" stroke="#f472b6" stroke-width="3"/><text x="84" y="500">Push to GitHub</text>
    </g>
  </g>

  <!-- android robot sticker -->
  <g transform="translate(575 520)">
    <circle cx="65" cy="65" r="78" fill="#fff" filter="url(#sh)"/>
    <path d="M20 80 a45 45 0 0 1 90 0 z" fill="#34d399"/>
    <rect x="20" y="86" width="90" height="46" rx="10" fill="#34d399"/>
    <circle cx="48" cy="62" r="5" fill="#fff"/><circle cx="82" cy="62" r="5" fill="#fff"/>
    <line x1="38" y1="40" x2="30" y2="26" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <line x1="92" y1="40" x2="100" y2="26" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="180" y="120" font-size="40" fill="#f472b6">✦</text>
  <text x="1110" y="720" font-size="34" fill="#a78bfa">✦</text>
  <text x="1150" y="140" font-size="24" fill="#818cf8">✦</text>
</svg>
