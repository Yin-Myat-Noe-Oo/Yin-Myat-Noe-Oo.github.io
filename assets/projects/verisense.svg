<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4f46e5" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1120" cy="680" r="230" fill="#c4b5fd" opacity=".35"/>
  <circle cx="120" cy="120" r="150" fill="#fbcfe8" opacity=".45"/>

  <!-- big shield -->
  <g transform="translate(150 150)" filter="url(#sh)">
    <path d="M200 0 L380 70 C380 260 310 390 200 460 C90 390 20 260 20 70 Z" fill="url(#shield)"/>
    <path d="M200 40 L345 98 C345 255 288 360 200 418 C112 360 55 255 55 98 Z" fill="#fff" opacity=".18"/>
    <path d="M125 230 L180 285 L290 170" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="350" y="690" text-anchor="middle" font-size="40" font-weight="800" fill="#3730a3">VERISENSE</text>
  <text x="350" y="728" text-anchor="middle" font-size="19" fill="#6b5d86">Think before you share 💜</text>

  <!-- message cards -->
  <g filter="url(#sh)">
    <rect x="640" y="120" width="520" height="150" rx="26" fill="#fff"/>
    <rect x="640" y="300" width="520" height="150" rx="26" fill="#fff"/>
    <rect x="640" y="480" width="520" height="190" rx="26" fill="#fff"/>
  </g>
  <circle cx="700" cy="180" r="30" fill="#fee2e2"/><text x="700" y="191" text-anchor="middle" font-size="30">⚠️</text>
  <text x="750" y="172" font-size="21" font-weight="700" fill="#1e1b4b">"You won $5,000! Click here…"</text>
  <rect x="750" y="192" width="170" height="34" rx="17" fill="#fee2e2"/><text x="835" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Likely a scam</text>
  <rect x="930" y="192" width="200" height="34" rx="17" fill="#fef3c7"/><text x="1030" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Urgency trick</text>

  <circle cx="700" cy="360" r="30" fill="#fef3c7"/><text x="700" y="371" text-anchor="middle" font-size="30">🧐</text>
  <text x="750" y="352" font-size="21" font-weight="700" fill="#1e1b4b">"Shocking news photo goes viral"</text>
  <rect x="750" y="372" width="230" height="34" rx="17" fill="#ede9fe"/><text x="865" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Check the source first</text>

  <text x="672" y="525" font-size="20" font-weight="800" fill="#3730a3">Your literacy score</text>
  <rect x="672" y="545" width="456" height="22" rx="11" fill="#ede9fe"/>
  <rect x="672" y="545" width="350" height="22" rx="11" fill="url(#pink)"/>
  <text x="1128" y="600" text-anchor="end" font-size="18" font-weight="700" fill="#c026d3">77% · Great job! ✨</text>
  <rect x="672" y="615" width="140" height="36" rx="18" fill="#e0e7ff"/><text x="742" y="639" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">🔍 Verify</text>
  <rect x="824" y="615" width="140" height="36" rx="18" fill="#fce7f3"/><text x="894" y="639" text-anchor="middle" font-size="15" font-weight="700" fill="#be185d">📚 Learn</text>

  <text x="590" y="110" font-size="36" fill="#f472b6">✦</text>
  <text x="1210" y="90" font-size="28" fill="#818cf8">✦</text>
</svg>
