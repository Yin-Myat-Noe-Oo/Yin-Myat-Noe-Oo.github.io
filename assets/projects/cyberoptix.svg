<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede4ff"/><stop offset="1" stop-color="#ffe4f3"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="scr1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="scr3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7c3aed" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="160" fill="#f9a8d4" opacity=".35"/>
  <circle cx="80" cy="760" r="200" fill="#c4b5fd" opacity=".4"/>

  <!-- browser window -->
  <g filter="url(#sh)">
    <rect x="90" y="70" width="1100" height="660" rx="28" fill="#fff"/>
  </g>
  <rect x="90" y="70" width="1100" height="58" rx="28" fill="#f6f0ff"/>
  <rect x="90" y="100" width="1100" height="28" fill="#f6f0ff"/>
  <circle cx="132" cy="99" r="9" fill="#fb7185"/><circle cx="162" cy="99" r="9" fill="#fbbf24"/><circle cx="192" cy="99" r="9" fill="#34d399"/>
  <rect x="420" y="84" width="440" height="30" rx="15" fill="#fff"/>
  <text x="640" y="105" text-anchor="middle" font-size="16" fill="#8b7aa8">cyberoptix.shop</text>

  <!-- header -->
  <text x="140" y="190" font-size="34" font-weight="700" fill="#4c1d95">CyberOptix</text>
  <text x="140" y="222" font-size="18" fill="#8b7aa8">Laptops picked just for you ✨</text>
  <rect x="910" y="160" width="220" height="50" rx="25" fill="url(#btn)"/>
  <text x="1020" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">🛒 Cart (2)</text>

  <!-- product cards -->
  <g>
    <rect x="140" y="260" width="250" height="300" rx="22" fill="#faf7ff" stroke="#ede4ff" stroke-width="2"/>
    <rect x="165" y="285" width="200" height="130" rx="14" fill="url(#scr1)"/>
    <rect x="150" y="415" width="230" height="12" rx="6" fill="#ddd6fe"/>
    <text x="165" y="460" font-size="20" font-weight="700" fill="#4c1d95">Aero 14</text>
    <text x="165" y="488" font-size="16" fill="#8b7aa8">16GB · 512GB SSD</text>
    <rect x="165" y="508" width="90" height="32" rx="16" fill="#ede4ff"/><text x="210" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">$899</text>
  </g>
  <g>
    <rect x="410" y="260" width="250" height="300" rx="22" fill="#fff5fb" stroke="#ffe4f3" stroke-width="2"/>
    <rect x="435" y="285" width="200" height="130" rx="14" fill="url(#scr2)"/>
    <rect x="420" y="415" width="230" height="12" rx="6" fill="#fbcfe8"/>
    <text x="435" y="460" font-size="20" font-weight="700" fill="#4c1d95">Nova Pro</text>
    <text x="435" y="488" font-size="16" fill="#8b7aa8">32GB · RTX graphics</text>
    <rect x="435" y="508" width="100" height="32" rx="16" fill="#ffe4f3"/><text x="485" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#db2777">$1,499</text>
    <rect x="560" y="272" width="88" height="30" rx="15" fill="#f472b6"/><text x="604" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">For you ♥</text>
  </g>
  <g>
    <rect x="680" y="260" width="250" height="300" rx="22" fill="#f5fbff" stroke="#e0f2fe" stroke-width="2"/>
    <rect x="705" y="285" width="200" height="130" rx="14" fill="url(#scr3)"/>
    <rect x="690" y="415" width="230" height="12" rx="6" fill="#bae6fd"/>
    <text x="705" y="460" font-size="20" font-weight="700" fill="#4c1d95">Lumen Air</text>
    <text x="705" y="488" font-size="16" fill="#8b7aa8">8GB · ultra-light</text>
    <rect x="705" y="508" width="90" height="32" rx="16" fill="#e0f2fe"/><text x="750" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">$649</text>
  </g>

  <!-- chatbot -->
  <g filter="url(#sh)">
    <rect x="960" y="250" width="200" height="440" rx="24" fill="#fff"/>
  </g>
  <rect x="960" y="250" width="200" height="60" rx="24" fill="url(#btn)"/>
  <rect x="960" y="285" width="200" height="25" fill="url(#btn)"/>
  <text x="1060" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">🤖 AI Assistant</text>
  <rect x="975" y="330" width="160" height="56" rx="16" fill="#f3edff"/>
  <text x="988" y="354" font-size="14" fill="#5b4a7a">Hi! What will you</text><text x="988" y="374" font-size="14" fill="#5b4a7a">use it for?</text>
  <rect x="1005" y="400" width="140" height="40" rx="16" fill="#a78bfa"/>
  <text x="1075" y="425" text-anchor="middle" font-size="14" fill="#fff">Coding + gaming</text>
  <rect x="975" y="455" width="165" height="76" rx="16" fill="#f3edff"/>
  <text x="988" y="480" font-size="14" fill="#5b4a7a">Try the Nova Pro —</text><text x="988" y="500" font-size="14" fill="#5b4a7a">great GPU and a</text><text x="988" y="520" font-size="14" fill="#5b4a7a">fast SSD ✨</text>
  <rect x="975" y="630" width="170" height="42" rx="21" fill="#faf7ff" stroke="#ede4ff" stroke-width="2"/>
  <text x="993" y="657" font-size="14" fill="#b3a6cc">Ask anything…</text>

  <!-- payment badges -->
  <rect x="140" y="590" width="790" height="100" rx="22" fill="#faf7ff"/>
  <text x="170" y="635" font-size="18" font-weight="700" fill="#4c1d95">Secure checkout</text>
  <text x="170" y="663" font-size="15" fill="#8b7aa8">Pay your way</text>
  <rect x="560" y="613" width="160" height="54" rx="14" fill="#fff" stroke="#ede4ff" stroke-width="2"/><text x="640" y="647" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">PayPal</text>
  <rect x="740" y="613" width="160" height="54" rx="14" fill="#fff" stroke="#ede4ff" stroke-width="2"/><text x="820" y="647" text-anchor="middle" font-size="20" font-weight="700" fill="#635bff">stripe</text>

  <text x="1215" y="760" font-size="44" fill="#f472b6">✦</text>
  <text x="40" y="60" font-size="34" fill="#a78bfa">✦</text>
</svg>
